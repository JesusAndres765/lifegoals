name: Angular_DockerImage
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  angular_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js 20.x
        uses: actions/setup-node@v1
        with:
          node-version: 20.x

      - name: npm install
        run: npm ci --legacy-peer-deps

      - name: build
        run: npm run build

      - name: docker login
        env:
          DOCKER_USER: ${{secrets.DOCKER_USER}}
          DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

      - name: Build the custom Docker image
        run: |
          docker build -t ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }} .
          docker tag ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }} ${{secrets.DOCKER_USER}}/lifegoals:latest

      - name: Docker Push
        run: |
          docker push ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }}
          docker push ${{secrets.DOCKER_USER}}/lifegoals:latest

      - name: Trigger Render Deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      - name: Verify htaccess and apache config
        run: docker run --rm ${{secrets.DOCKER_USER}}/lifegoals:${{ github.sha }} grep -A10 htdocs /usr/local/apache2/conf/httpd.conf